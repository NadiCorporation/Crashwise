# ──────────────────────────────────────────────────────────────────────────────
# CrashWise — Full-Stack Production Docker Compose
#
# Services:
#   temporal-server  — Temporal workflow engine (auto-setup)
#   temporal-ui      — Temporal Web UI (port 8233)
#   postgres         — Persistence layer (campaigns, crashes, runs)
#   redis            — Distributed state / counters / dedup cache
#   minio            — Local S3-compatible storage (R2 emulation)
#   api              — FastAPI management server (port 8000)
#   dashboard        — Streamlit intelligence dashboard (port 8501)
#   worker           — Temporal worker(s) — scale with `docker compose up --scale worker=N`
#
# Usage:
#   cp .env.example .env   # edit secrets
#   docker compose up -d
# ──────────────────────────────────────────────────────────────────────────────

services:
  # ════════════════════════════════════════════════════════════════════════════
  # Temporal Server
  # ════════════════════════════════════════════════════════════════════════════
  temporal-server:
    image: temporalio/auto-setup:1.25
    container_name: crashwise-temporal
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-temporal}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-temporal}
      POSTGRES_SEEDS: postgres
      # By default ``temporalio/auto-setup`` binds the gRPC frontend
      # to the container's *specific* IP (e.g. 172.18.0.5).  On Linux,
      # bind(2) to a specific IP only accepts connections to that IP —
      # so any healthcheck that connects to 127.0.0.1:7233 fails at the
      # kernel level with "connection refused", regardless of how long
      # we wait or how many retries we configure.  Forcing
      # ``BIND_ON_IP=0.0.0.0`` makes the server listen on all interfaces
      # (incl. loopback), which is required for the in-container
      # ``tctl ... cluster health`` probe below.
      BIND_ON_IP: "0.0.0.0"
    ports:
      - "${TEMPORAL_PORT:-7233}:7233"
    depends_on:
      postgres:
        condition: service_healthy
    # Healthcheck pattern follows the official temporalio/docker-compose
    # repository.  ``tctl --ad 127.0.0.1:7233 cluster health`` is the
    # canonical check for the auto-setup image and exits 0 only after
    # both the gRPC frontend AND the PostgreSQL schema migration
    # ("temporal-sql-tool setup-schema") have completed.
    #
    # First-boot timing: schema migration + namespace seeding can take
    # 60-120 seconds on a cold disk, so we use ``retries: 60`` with a
    # 1 s interval (= 60 s tolerance after start_period) and a generous
    # 90 s start_period.  Earlier values (30 s start + 50 s retries)
    # were on the edge and caused intermittent UNHEALTHY on slower
    # machines.
    healthcheck:
      test: ["CMD", "tctl", "--ad", "127.0.0.1:7233", "cluster", "health"]
      interval: 1s
      timeout: 5s
      retries: 60
      start_period: 90s
    networks:
      - crashwise

  temporal-ui:
    image: temporalio/ui:2.30.0
    container_name: crashwise-temporal-ui
    environment:
      TEMPORAL_ADDRESS: temporal-server:7233
      TEMPORAL_CORS_ORIGINS: ${TEMPORAL_CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "${TEMPORAL_UI_PORT:-8233}:8233"
    depends_on:
      temporal-server:
        condition: service_healthy
    networks:
      - crashwise

  # ════════════════════════════════════════════════════════════════════════════
  # PostgreSQL (shared by Temporal + CrashWise)
  # ════════════════════════════════════════════════════════════════════════════
  postgres:
    image: postgres:16-alpine
    container_name: crashwise-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-temporal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-temporal}
      POSTGRES_DB: ${POSTGRES_DB:-temporal}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-temporal}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - crashwise

  # ════════════════════════════════════════════════════════════════════════════
  # Redis
  # ════════════════════════════════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: crashwise-redis
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - crashwise

  # ════════════════════════════════════════════════════════════════════════════
  # MinIO (S3-compatible, for local R2 emulation)
  # ════════════════════════════════════════════════════════════════════════════
  minio:
    image: minio/minio:latest
    container_name: crashwise-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-crashwise}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-crashwise-secret}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crashwise

  # ════════════════════════════════════════════════════════════════════════════
  # CrashWise API (FastAPI)
  # ════════════════════════════════════════════════════════════════════════════
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crashwise-api
    init: true
    command: ["crashwise", "api", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    environment:
      CRASHWISE_ENV: ${CRASHWISE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-temporal}:${POSTGRES_PASSWORD:-temporal}@postgres:5432/${POSTGRES_DB:-temporal}}
      TEMPORAL_HOST: ${TEMPORAL_HOST:-temporal-server:7233}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-crashwise}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_ENABLED: ${REDIS_ENABLED:-true}
      R2_ENABLED: ${R2_ENABLED:-false}
      R2_ENDPOINT_URL: ${R2_ENDPOINT_URL:-http://minio:9000}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-crashwise}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-crashwise-secret}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-crashwise}
      NOTIFICATIONS_ENABLED: ${NOTIFICATIONS_ENABLED:-false}
      CRASHWISE_WORKDIR: ${CRASHWISE_WORKDIR:-/tmp/crashwise}
      CRASHWISE_BUILD_TIMEOUT: ${CRASHWISE_BUILD_TIMEOUT:-900}
    ports:
      - "${CRASHWISE_API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal-server:
        condition: service_healthy
    # api startup involves SQLAlchemy DB pool init + Temporal client
    # connect; on a cold start the wall-clock can exceed the previous
    # 10 s start_period.  60 s is generous and matches the worker.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - crashwise
    restart: unless-stopped

  # ════════════════════════════════════════════════════════════════════════════
  # CrashWise Dashboard (Next.js)
  # ════════════════════════════════════════════════════════════════════════════
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: crashwise-dashboard
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://api:8000}
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - crashwise
    restart: unless-stopped

  # ════════════════════════════════════════════════════════════════════════════
  # CrashWise Worker (Temporal) — Master Fuzz-Node
  # ════════════════════════════════════════════════════════════════════════════
  # Uses Dockerfile.worker which bundles AFL++, LibFuzzer, Clang, and all
  # build dependencies. The host only needs Docker; heavy lifting is inside.
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    init: true
    command: ["crashwise", "worker"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp:/tmp
    environment:
      CRASHWISE_ENV: ${CRASHWISE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-temporal}:${POSTGRES_PASSWORD:-temporal}@postgres:5432/${POSTGRES_DB:-temporal}}
      TEMPORAL_HOST: ${TEMPORAL_HOST:-temporal-server:7233}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-crashwise}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_ENABLED: ${REDIS_ENABLED:-true}
      R2_ENABLED: ${R2_ENABLED:-false}
      R2_ENDPOINT_URL: ${R2_ENDPOINT_URL:-http://minio:9000}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-crashwise}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-crashwise-secret}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-crashwise}
      NOTIFICATIONS_ENABLED: ${NOTIFICATIONS_ENABLED:-false}
      CRASHWISE_WORKDIR: ${CRASHWISE_WORKDIR:-/tmp/crashwise}
      CRASHWISE_BUILD_TIMEOUT: ${CRASHWISE_BUILD_TIMEOUT:-900}
      CRASHWISE_LLM_MODEL: ${CRASHWISE_LLM_MODEL:-claude-sonnet-4-5}
      CRASHWISE_LLM_TEMPERATURE: ${CRASHWISE_LLM_TEMPERATURE:-0.0}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      OLLAMA_URL: ${OLLAMA_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal-server:
        condition: service_healthy
    networks:
      - crashwise
    restart: unless-stopped
    deploy:
      replicas: 1

volumes:
  postgres-data:
  redis-data:
  minio-data:

networks:
  crashwise:
    driver: bridge
