name: "🐛 Bug Report"
description: File a bug report or crash anomaly in CrashWise
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue in CrashWise. Please provide clear details so we can reproduce and fix the bug.
  - type: input
    id: version
    attributes:
      label: CrashWise Version
      description: What version of CrashWise are you running? (Run `crashwise --version`)
      placeholder: "e.g. 0.2.0-dev (commit a7fd1c8)"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS & Environment
      description: What operating system, Linux kernel, and toolchain versions are you using?
      placeholder: "e.g. Ubuntu 24.04 LTS, Clang 18.1.3, Linux 6.8.0-31-generic"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps or exact command line to reproduce the behavior.
      placeholder: |
        1. Run `crashwise run ...`
        2. Fuzzing starts...
        3. Fails at stage X with error ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs & Terminal Output
      description: Paste relevant terminal logs, stack traces, or compiler error outputs.
      render: shell
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct & Security
      options:
        - label: I have verified this is not a security vulnerability in CrashWise itself (for security vulnerabilities, see [SECURITY.md](https://github.com/NadiCorporation/Crashwise/blob/master/SECURITY.md)).
          required: true
