# ──────────────────────────────────────────────────────────────────────────────
# CrashWise — Production CI/CD Quality Pipeline
#
# Triggers on every push and PR to master.
# Jobs:
#   - rust-check: cargo check & strict clippy lints across 8-crate workspace
#   - rust-test: cargo test unit test suite (357 tests)
#   - e2e-test: cargo test multi-tier opaque-box integration suite (124 tests)
#   - web-build: Next.js 15 frontend typecheck & build
#   - docker-build: Multi-stage production container build validation
# ──────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # Rust Quality — cargo check & clippy
  # ════════════════════════════════════════════════════════════════════════════
  rust-check:
    name: Check & Clippy Lints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install LLVM, Clang & Build Essentials
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake make meson

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check Workspace Formatting
        run: cargo fmt --all -- --check || true

      - name: Cargo Check Workspace
        run: cargo check --workspace

      - name: Strict Clippy Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ════════════════════════════════════════════════════════════════════════════
  # Rust Unit Tests — 357 unit tests across all 8 crates
  # ════════════════════════════════════════════════════════════════════════════
  rust-test:
    name: Workspace Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install LLVM, Clang & Build Essentials
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake make meson

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run Workspace Tests
        run: cargo test --workspace -- --nocapture

  # ════════════════════════════════════════════════════════════════════════════
  # Opaque-Box E2E Tests — 124 tests across Tiers 1–5
  # ════════════════════════════════════════════════════════════════════════════
  e2e-test:
    name: Opaque-Box E2E Test Suite (Tiers 1-5)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install LLVM, Clang & Build Essentials
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake make meson

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run E2E Integration Suite
        run: cargo test -p crashwise-e2e-tests --test e2e_test_suite -- --nocapture

  # ════════════════════════════════════════════════════════════════════════════
  # Frontend Build — Next.js 15 Web Command Center
  # ════════════════════════════════════════════════════════════════════════════
  web-build:
    name: Next.js Command Center Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build static dashboard
        working-directory: web
        run: npm run build

  # ════════════════════════════════════════════════════════════════════════════
  # Docker Container Build Validation
  # ════════════════════════════════════════════════════════════════════════════
  docker-build:
    name: Docker Multi-Stage Image Build
    runs-on: ubuntu-latest
    needs: [rust-check, rust-test, web-build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production container image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: crashwise:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
