# ──────────────────────────────────────────────────────────────────────────────
# CrashWise — CI/CD Quality Pipeline
#
# Triggers on every push and PR to main.
# Jobs: lint (ruff), type-check (mypy), test (pytest), build (docker).
# ──────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # Lint — Ruff (fast, unified linter + formatter)
  # ════════════════════════════════════════════════════════════════════════════
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen --no-install-project

      - name: Ruff check
        run: uv run ruff check crashwise/ tests/

      - name: Ruff format check
        run: uv run ruff format --check crashwise/ tests/

  # ════════════════════════════════════════════════════════════════════════════
  # Type Check — Strict mypy
  # ════════════════════════════════════════════════════════════════════════════
  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen --no-install-project

      - name: mypy (strict)
        run: uv run mypy crashwise/ --config-file pyproject.toml

  # ════════════════════════════════════════════════════════════════════════════
  # Test — Full pytest suite
  # ════════════════════════════════════════════════════════════════════════════
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --no-install-project

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short --cov=crashwise --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # ════════════════════════════════════════════════════════════════════════════
  # Build — Docker image
  # ════════════════════════════════════════════════════════════════════════════
  build:
    name: Build (Docker)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: crashwise:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
